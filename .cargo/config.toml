# Cargo configuration for cross-compilation
# See: https://doc.rust-lang.org/cargo/reference/config.html

# Android targets - used with cargo-ndk or direct NDK toolchain
# The linkers are provided by the Android NDK (set ANDROID_NDK_HOME)
#
# For Windows cross-compilation to Android:
#   1. Install Android NDK (r26+) via Android Studio or standalone
#   2. Set ANDROID_NDK_HOME environment variable
#   3. Run: rustup target add aarch64-linux-android
#   4. Use scripts/android/build-android-tui.ps1

# ARM64 - most modern Android devices
# WP-LATENCY-STT: Enable SIMD features for hardware-accelerated vector operations
# - neon: ARM NEON SIMD (standard on all ARM64)
# - dotprod: ARMv8.2-A dot product instructions (~2x speedup for quantized ops)
# - fp16: Half-precision floating point (reduces memory bandwidth)
[target.aarch64-linux-android]
rustflags = ["-C", "target-feature=+neon,+dotprod,+fp16"]

# x86_64 - Android emulators and some Chromebooks
# WP-LATENCY-STT: Ensure x86-64 baseline optimization
[target.x86_64-linux-android]
rustflags = ["-C", "target-cpu=x86-64"]

# ARM32 - older Android devices
[target.armv7-linux-androideabi]

# x86 - older emulators
[target.i686-linux-android]

# Environment variables for native builds
[env]
# These are set when ANDROID_NDK_HOME is defined
# CMAKE_TOOLCHAIN_FILE is needed for whisper.cpp cross-compilation

# Build configuration
[build]
# Uncomment to set default target for Android development:
# target = "aarch64-linux-android"

# Profile optimizations (WP-LATENCY-STT)
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package."*"]
opt-level = 3

# Android-specific release profile (WP-LATENCY-STT)
# Use opt-level = 3 for maximum speed (not "s" for size)
# The latency impact of size optimization is significant for STT inference
[profile.release-android]
inherits = "release"
opt-level = 3
