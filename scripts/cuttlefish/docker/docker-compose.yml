# docker-compose.yml
# Cuttlefish Android Emulator with Docker
#
# Usage:
#   docker-compose up -d      # Start Cuttlefish
#   docker-compose logs -f    # View logs
#   docker-compose exec cuttlefish adb shell  # ADB shell
#   docker-compose down       # Stop

services:
  cuttlefish:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cuttlefish

    # Required for KVM and vsock access
    privileged: true
    devices:
      - /dev/kvm:/dev/kvm
      - /dev/vhost-vsock:/dev/vhost-vsock
    group_add:
      - "994"   # KVM group ID on host
      - "119"   # cvdnetwork group ID on host

    # Networking
    network_mode: host  # Simplest for ADB access
    # Alternative: use bridge network with port mapping
    # ports:
    #   - "6520:6520"   # ADB
    #   - "8443:8443"   # WebRTC

    # Environment
    environment:
      - CVD_CPUS=4
      - CVD_MEMORY_MB=4096
      - CVD_HEADLESS=true
      - CVD_GPU_MODE=guest_swiftshader
      - CVD_VM_MANAGER=crosvm
      - BOOT_TIMEOUT=300

    # Volumes
    volumes:
      # Cuttlefish host package and runtime data (all in one volume)
      - cuttlefish-host:/opt/cuttlefish
      # Android system images (optional, can be in host volume)
      - cuttlefish-images:/opt/android-images
    # Tmpfs for temp files
    tmpfs:
      - /tmp:exec,mode=1777

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '6'
          memory: 8G
        reservations:
          cpus: '4'
          memory: 4G

    # Keep running
    restart: unless-stopped

    # Health check
    healthcheck:
      test: ["CMD", "docker-entrypoint.sh", "status"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  cuttlefish-host:
    external: true
  cuttlefish-images:
    external: true
  cuttlefish-runtime:
    external: true
