[package]
name = "lexicon-core"
description = "Core library for Lexicon Local Server - STT, translation, and TTS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["stt", "tts", "storage", "audio", "audio-convert", "system-profile"]
stt = ["dep:whisper-rs"]
stt-sherpa = ["dep:sherpa-rs"]
stt-parakeet = ["dep:parakeet-rs", "dep:ort", "dep:ndarray"]
stt-all = ["stt", "stt-sherpa", "stt-parakeet"]
tts = ["dep:ort", "dep:ndarray", "dep:tts", "dep:misaki-rs"]
storage = ["dep:rusqlite"]
audio = ["dep:cpal", "dep:rubato", "dep:webrtc-vad", "dep:ringbuf"]
audio-convert = ["dep:symphonia"]
system-profile = ["dep:sysinfo", "dep:dirs"]
noise-reduction = ["dep:nnnoiseless"]
server = []
ffi = []
# Feature for test utilities (exposes functions useful for testing)
test-utils = []

[dependencies]
# Database
rusqlite = { workspace = true, optional = true }

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# Utilities
directories.workspace = true
chrono.workspace = true

# System profiling
sysinfo = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }

# Cryptography / Model verification
sha2.workspace = true
hex.workspace = true
minisign-verify.workspace = true

# HTTP client (for model downloads)
reqwest.workspace = true
futures-util.workspace = true

# Async runtime
tokio.workspace = true

# Audio capture and processing
cpal = { workspace = true, optional = true }
rubato = { workspace = true, optional = true }
webrtc-vad = { workspace = true, optional = true }
ringbuf = { workspace = true, optional = true }

# Speech-to-Text (Whisper)
whisper-rs = { workspace = true, optional = true }

# Speech-to-Text (sherpa-onnx) - streaming architecture for low latency
sherpa-rs = { workspace = true, optional = true }

# Speech-to-Text (parakeet-rs) - NVIDIA Parakeet CTC/TDT via ONNX Runtime
parakeet-rs = { workspace = true, optional = true }

# Text-to-Speech
ort = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
tts = { workspace = true, optional = true }
misaki-rs = { version = "0.1", optional = true }

# Audio format conversion
symphonia = { workspace = true, optional = true }

# Noise reduction (RNNoise via nnnoiseless)
nnnoiseless = { workspace = true, optional = true }

[dev-dependencies]
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
tempfile.workspace = true
criterion = { workspace = true }
hound.workspace = true

[[bench]]
name = "audio_pipeline"
harness = false

[[bench]]
name = "stt_latency"
harness = false

[[bench]]
name = "tts_latency"
harness = false

[lints]
workspace = true
