[package]
name = "lexicon-flutter"
version.workspace = true
edition.workspace = true
description = "Flutter/Dart bindings for Lexicon via flutter_rust_bridge"
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
default = ["stt", "tts"]
stt = ["lexicon-core/stt", "lexicon-core/audio"]
stt-sherpa = ["lexicon-core/stt-sherpa", "lexicon-core/audio"]
stt-parakeet = ["lexicon-core/stt-parakeet", "lexicon-core/audio"]
stt-all = ["stt", "stt-sherpa", "stt-parakeet"]
noise-reduction = ["lexicon-core/noise-reduction"]
tts = ["lexicon-core/tts"]

[dependencies]
lexicon-core.workspace = true
flutter_rust_bridge = "=2.11.1"
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
# flutter_rust_bridge uses frb_expand cfg internally
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }
