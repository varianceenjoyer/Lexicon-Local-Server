[package]
name = "lexicon-server"
description = "HTTP/WebSocket server for Lexicon Local Server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["stt", "tts", "storage"]
stt = ["lexicon-core/stt"]
tts = ["lexicon-core/tts"]
storage = ["lexicon-core/storage"]

[dependencies]
lexicon-core = { workspace = true, features = ["audio", "audio-convert", "system-profile"] }

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Async runtime
tokio.workspace = true

# HTTP server
axum.workspace = true
tower.workspace = true
tower-http.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Encoding
base64.workspace = true

# Time handling
chrono.workspace = true

[dev-dependencies]
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }

[lints]
workspace = true
