[package]
name = "lexicon-cli"
description = "Command-line interface for Lexicon Local Server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "lexicon"
path = "src/main.rs"

[features]
default = ["stt", "tts", "storage", "audio"]
stt = ["lexicon-core/stt", "lexicon-server/stt"]
tts = ["lexicon-core/tts", "lexicon-server/tts"]
storage = ["lexicon-core/storage", "lexicon-server/storage"]
audio = ["lexicon-core/audio", "lexicon-core/audio-convert"]

[dependencies]
lexicon-core = { workspace = true, features = ["system-profile"] }
lexicon-server = { path = "../lexicon-server", default-features = false }

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Async runtime
tokio.workspace = true

# CLI
clap.workspace = true
clap_complete.workspace = true
indicatif.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Time handling
chrono.workspace = true

# Audio file reading
hound.workspace = true

# Audio capture (for TUI)
cpal.workspace = true

# TUI
ratatui.workspace = true
crossterm.workspace = true

# Clipboard (desktop platforms only - not supported on Android)
[target.'cfg(not(target_os = "android"))'.dependencies]
arboard.workspace = true

[dev-dependencies]
# CLI testing
assert_cmd = "2.0"
predicates = "3.1"
tempfile.workspace = true

[lints]
workspace = true
