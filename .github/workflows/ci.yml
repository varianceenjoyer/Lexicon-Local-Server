name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: 'Run performance benchmarks'
        required: false
        default: 'false'
        type: boolean
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Lint job - runs quickly on Linux only
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-features -- -D warnings

  # Build and test matrix across platforms
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          targets: ${{ matrix.target }}

      # Linux dependencies
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libasound2-dev \
            libclang-dev \
            libspeechd-dev \
            cmake

      # macOS dependencies
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> $GITHUB_ENV

      # Windows dependencies
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: |
          choco install llvm cmake -y
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --workspace --all-features

      - name: Run tests
        run: cargo test --workspace --all-features

  # Documentation build
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libasound2-dev \
            libclang-dev \
            libspeechd-dev \
            cmake

      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps

  # Code coverage (Linux only)
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          components: llvm-tools-preview

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libasound2-dev \
            libclang-dev \
            libspeechd-dev \
            cmake

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  # Performance benchmarks (optional - runs nightly or on demand)
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    # Run on schedule, manual trigger with benchmarks enabled, or nightly
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_benchmarks == true)
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libasound2-dev \
            libclang-dev \
            libspeechd-dev \
            cmake

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Run benchmarks
        run: cargo bench --workspace --all-features -- --noplot
        continue-on-error: true

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: target/criterion
          retention-days: 30
        if: always()

  # Long-running stability tests (nightly only)
  stability:
    name: Stability Tests
    runs-on: ubuntu-latest
    # Run only on nightly schedule
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libasound2-dev \
            libclang-dev \
            libspeechd-dev \
            cmake

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-stability-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stability-

      - name: Run stability tests
        run: cargo test --test e2e_tests stability -- --ignored --nocapture
        continue-on-error: true
        timeout-minutes: 60

      - name: Upload stability test logs
        uses: actions/upload-artifact@v4
        with:
          name: stability-test-results
          path: |
            target/*.log
          retention-days: 7
        if: always()

  # Memory leak detection (nightly or on demand)
  memory-test:
    name: Memory Leak Detection
    runs-on: ubuntu-latest
    # Run on nightly schedule or manual trigger
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libasound2-dev \
            libclang-dev \
            libspeechd-dev \
            cmake \
            valgrind

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-memory-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-memory-

      - name: Build memory stress test (release)
        run: cargo build --release --test memory_stress_test --all-features

      - name: Run memory stress test
        run: |
          # Run the test directly first to verify it passes
          cargo test --release --test memory_stress_test --all-features -- --test-threads=1 --nocapture
        timeout-minutes: 15

      - name: Run with valgrind (leak summary)
        run: |
          # Find the test binary
          TEST_BINARY=$(find target/release/deps -name 'memory_stress_test-*' -type f -executable | head -1)
          if [ -z "$TEST_BINARY" ]; then
            echo "Test binary not found"
            exit 1
          fi
          echo "Running valgrind on: $TEST_BINARY"

          # Run valgrind with leak check - focus on definitely lost
          valgrind --leak-check=full \
            --show-leak-kinds=definite \
            --error-exitcode=1 \
            --errors-for-leak-kinds=definite \
            --log-file=valgrind-report.txt \
            "$TEST_BINARY" --test-threads=1 test_context_lifecycle_no_leak || true

          # Show summary
          echo "=== Valgrind Summary ==="
          grep -A 20 "LEAK SUMMARY" valgrind-report.txt || echo "No leak summary found"
          grep "definitely lost" valgrind-report.txt || echo "No definite leaks found"
        timeout-minutes: 30
        continue-on-error: true

      - name: Upload valgrind report
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-memory-report
          path: valgrind-report.txt
          retention-days: 30
        if: always()
