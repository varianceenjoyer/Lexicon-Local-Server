[workspace]
resolver = "2"
members = [
    "crates/lexicon-core",
    "crates/lexicon-cli",
    "crates/lexicon-server",
    "crates/lexicon-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/example/lexicon-local-server"
rust-version = "1.85"

[workspace.dependencies]
# Database
rusqlite = { version = "0.32", features = ["bundled", "modern_sqlite"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Async runtime (for future use)
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Platform utilities
directories = "5"

# Cryptography / Model verification
sha2 = "0.10"
hex = "0.4"
minisign-verify = "0.2"

# HTTP client (for model downloads)
reqwest = { version = "0.12", features = ["stream", "rustls-tls"], default-features = false }
futures-util = "0.3"

# Testing
tempfile = "3"

# Audio capture and processing
cpal = "0.15"
rubato = "0.16"
webrtc-vad = "0.4"
ringbuf = "0.4"

# Speech-to-Text (Whisper)
whisper-rs = "0.14"

# Text-to-Speech
ort = { version = "2.0.0-rc.11", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-rustls"] }
ndarray = "0.17"
tts = "0.26"

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
indicatif = "0.17"

# Audio file reading
hound = "3.5"

# Encoding
base64 = "0.22"

# Web server (Axum)
axum = { version = "0.7", features = ["ws", "macros"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }

# Internal crates
lexicon-core = { path = "crates/lexicon-core" }

# FFI (UniFFI for Swift/Kotlin bindings)
uniffi = "0.31"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

# Workspace-level package for E2E tests
[package]
name = "lexicon-workspace"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["storage", "audio", "stt", "tts"]
storage = ["lexicon-core/storage"]
audio = ["lexicon-core/audio"]
stt = ["lexicon-core/stt"]
tts = ["lexicon-core/tts"]
bench = []

[dependencies]
lexicon-core = { path = "crates/lexicon-core" }
lexicon-server = { path = "crates/lexicon-server" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

[[test]]
name = "e2e_tests"
path = "tests/e2e_tests.rs"

[[bin]]
name = "generate-fixtures"
path = "tests/fixtures/generate_audio.rs"
